version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: viral-shorts-postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER:-viral_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${DATABASE_NAME:-viral_shorts_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-viral_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - viral-shorts-network

  # Redis Cache & Job Queue
  redis:
    image: redis:7-alpine
    container_name: viral-shorts-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - viral-shorts-network

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: viral-shorts-backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${DATABASE_USER:-viral_user}:${DATABASE_PASSWORD:-change_me_in_production}@postgres:5432/${DATABASE_NAME:-viral_shorts_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      ELEVEN_LABS_API_KEY: ${ELEVEN_LABS_API_KEY}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./uploads:/app/uploads
      - ./videos:/app/videos
      - ./logs:/app/logs
    networks:
      - viral-shorts-network

  # Frontend React Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: viral-shorts-frontend
    environment:
      VITE_API_URL: http://backend:3000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    networks:
      - viral-shorts-network

  # Background Job Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: viral-shorts-worker
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${DATABASE_USER:-viral_user}:${DATABASE_PASSWORD:-change_me_in_production}@postgres:5432/${DATABASE_NAME:-viral_shorts_db}
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ELEVEN_LABS_API_KEY: ${ELEVEN_LABS_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./uploads:/app/uploads
      - ./videos:/app/videos
      - ./logs:/app/logs
    networks:
      - viral-shorts-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  viral-shorts-network:
    driver: bridge
